<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="COURT SUMMON - OVERDUE AMOUNT" content="width=device-width, initial-scale=1.0">

<title>Judicial Services Portal</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, Helvetica, sans-serif;
}

/* FULL-SCREEN BACKGROUND AREA */
body {
    background: #eef1f5;
}

/* Background image fills everything BELOW blue tab */
.background-logo {
    position: fixed;

    top: 64px;
    left: 0;

    width: 100%;
    height: calc(100vh - 64px);

    object-fit: cover;

    opacity: 0.12;

    z-index: 0;
    pointer-events: none;
}

/* BLUE TOP TAB */
.navbar {
    position: relative;
    z-index: 10;

    width: 100%;
    height: 64px;

    background: #17365d;
    color: white;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 2%;
}

.nav-title {
    font-size: 19px;
    font-weight: bold;
}

.nav-links {
    display: flex;
    gap: 25px;
    font-size: 14px;
}

/* FULL SCREEN AREA UNDER TAB */
.main {
    position: relative;
    z-index: 2;

    width: 100%;
    min-height: calc(100vh - 64px);

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 40px 20px;
}

/* LOGIN CARD */
.login-card {
    width: 355px;
    max-width: 100%;

    background: rgba(255, 255, 255, 0.97);

    padding: 35px;

    border-radius: 5px;

    box-shadow: 0 4px 20px rgba(0,0,0,0.18);
}

.emblem {
    width: 85px;
    height: 85px;

    margin: 0 auto 18px;

    border: 3px solid #17365d;
    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: white;
    overflow: hidden;
}

.emblem img {
    width: 78%;
    height: 78%;

    object-fit: contain;
}

.subtitle {
    text-align: center;

    color: #777;

    font-size: 14px;

    margin-top: 8px;
}

    font-size: 13px;
}

h2 {
    font-size: 20px;
    font-weight: normal;

    margin: 0 0 22px;
}

label {
    display: block;

    font-size: 14px;

    margin-bottom: 7px;

    color: #444;
}

input {
    width: 100%;

    padding: 12px;

    margin-bottom: 18px;

    border: 1px solid #aaa;

    border-radius: 3px;

    font-size: 15px;
}

input:focus {
    outline: none;

    border-color: #17365d;
}

button {
    width: 100%;

    padding: 13px;

    background: #17365d;

    color: white;

    border: none;

    border-radius: 3px;

    font-size: 15px;

    cursor: pointer;
}

button:hover {
    background: #102947;
}

/* LINKS */
.links {
    text-align: center;
    margin-top: 22px;
}

.links a {
    color: #175a8a;

    font-size: 14px;

    text-decoration: none;
}



</style>
</head>
